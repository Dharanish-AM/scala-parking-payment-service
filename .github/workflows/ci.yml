name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: scala-parking-payment-service
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt and Ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.ivy2/local
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Run sbt test
        env:
          JAVA_OPTS: >-
            -Dslick.dbs.default.db.url=jdbc:mysql://127.0.0.1:3306/scala-parking-payment-service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            -Dslick.dbs.default.db.user=root
            -Dslick.dbs.default.db.password=root
        run: sbt -no-colors test

      - name: Run scalafmt check
        run: sbt -no-colors scalafmtCheck
